<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Urar s tkarḍiwin - Jeu de mémoire</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background: #f0e8da;
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            margin: 0;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #fffaf2;
            border-radius: 2rem;
            padding: 0.8rem 1.5rem 1.5rem;
            text-align: center;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.25rem;
        }
        .source-link {
            background: #1f618d;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .source-link a {
            color: white;
            text-decoration: none;
        }
        .source-link a:hover {
            text-decoration: underline;
        }
        .sound-toggle {
            background: #2980b9;
            border: none;
            border-radius: 2rem;
            padding: 0.3rem 0.7rem;
            font-size: 1.3rem;
            cursor: pointer;
            width: 48px;
            color: white;
        }
        h1 {
            color: #1a5f7a;
            margin: 0.5rem 0;
            font-size: 1.6rem;
        }
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .level-btn {
            background: #3498db;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .level-btn.active {
            background: #1f618d;
            color: white;
        }
        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background: #7f8c8d;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .stats div {
            background: white;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        @keyframes blinkMessage {
            0% { background-color: #fff9e6; color: #2c2418; border-color: #c2853e; }
            50% { background-color: #fdebb3; color: #1a5f7a; border-color: #1f618d; }
            100% { background-color: #fff9e6; color: #2c2418; border-color: #c2853e; }
        }
        #message {
            animation: blinkMessage 1.2s infinite;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            background: white;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .game-board {
            display: grid;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }
        .grid-4 { grid-template-columns: repeat(4, 1fr); max-width: 500px; margin: 0 auto; }
        .grid-5 { grid-template-columns: repeat(5, 1fr); max-width: 620px; margin: 0 auto; }
        .grid-6 { grid-template-columns: repeat(6, 1fr); max-width: 740px; margin: 0 auto; }
        
        .card {
            aspect-ratio: 3/2;
            border-radius: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
            padding: 0.3rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            color: white;
            word-break: break-word;
        }
        .card.easy-back { background: #2980b9; background: radial-gradient(circle at 30% 30%, #3498db, #1f618d); }
        .card.medium-back { background: #8e44ad; background: radial-gradient(circle at 30% 30%, #a569bd, #6c3483); }
        .card.hard-back { background: #2c3e50; background: radial-gradient(circle at 30% 30%, #3f5e7c, #1a252f); }
        .card:not(.flipped):not(.matched) {
            font-size: 2rem;
        }
        .card.flipped {
            background: #fff3e0;
            border-left: 5px solid #c2853e;
            color: #2c2418;
            font-size: 0.7rem;
        }
        .card.flipped .badge {
            background: rgba(0,0,0,0.15);
            color: #2c2418;
        }
        .card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .card .badge {
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 4px;
            font-size: 0.6rem;
        }
        #resetBtn {
            background: #2c6e8f;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }
        .info {
            font-size: 0.7rem;
            margin-top: 0.5rem;
            color: #2471a3;
        }
        @media (max-width: 650px) {
            .grid-4 { max-width: 350px; gap: 0.6rem; }
            .grid-5 { max-width: 450px; gap: 0.6rem; }
            .grid-6 { max-width: 540px; gap: 0.6rem; }
            .card:not(.flipped):not(.matched) { font-size: 1.6rem; }
        }
        @media (max-width: 500px) {
            .grid-4 { grid-template-columns: repeat(3, 1fr); max-width: 280px; }
            .grid-5 { grid-template-columns: repeat(4, 1fr); max-width: 360px; }
            .grid-6 { grid-template-columns: repeat(4, 1fr); max-width: 360px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="source-link">
            <a href="https://adrar-inu.blogspot.com/" target="_blank">Tala uMaziɣ</a>
        </div>
        <button id="soundToggleBtn" class="sound-toggle">🔊</button>
    </div>

    <h1>URAR N TKARḌIWIN</h1>

    <div class="level-selector">
        <button class="level-btn" data-level="easy">🔵 Ushil (16 n tkarḍiwin)</button>
        <button class="level-btn" data-level="medium">🟣 Alemmas (24 n tkarḍiwin)</button>
        <button class="level-btn" data-level="hard">⚫ Aweɛran (36 n tkarḍiwin)</button>
    </div>

    <div class="stats">
        <div>🏆 <span id="matchedCount">0</span> / <span id="totalCount">0</span></div>
        <div>🃏 <span id="flipCount">0</span></div>
    </div>

    <div id="message">🔍 Fren takarḍa</div>

    <div id="gameBoard" class="game-board"></div>

    <button id="resetBtn">⟳ Urar aswir-a i tikkelt-nniḍen</button>
    <div class="info">✅ Kfu aswir iwakken ad teldiḍ wayeḍ</div>
</div>

<script>
    const FULL_PAIRS = [
        { mistake: "Fellawn", correction: "Fell-awen" },
        { mistake: "Ismis", correction: "Isem-is" },
        { mistake: "Mara", correction: "Mi ara" },
        { mistake: "Tidett", correction: "Tidet" },
        { mistake: "Attili", correction: "Ad tili" },
        { mistake: "Ma wlac", correction: "Ma ulac" },
        { mistake: "Igzemren", correction: "I izemren" },
        { mistake: "Ini-as", correction: "Ini-yas" },
        { mistake: "Ttameṭṭut", correction: "D tameṭṭut" },
        { mistake: "Izegr-ed", correction: "Izger-d" },
        { mistake: "Am assa", correction: "Am wass-a" },
        { mistake: "Ak dqavel", correction: "Ad ak-d-tqabel" },
        { mistake: "Yaɣli", correction: "Yeɣli" },
        { mistake: "Deg mis", correction: "Deg yimi-s" },
        { mistake: "Tafkas", correction: "Taffeka-s" },
        { mistake: "Iɣlì", correction: "Yeɣli" },
        { mistake: "N Webrid", correction: "N ubrid" },
        { mistake: "Ḥemleghtt", correction: "Ḥemmleɣ-tt" }
    ];

    const LEVELS = {
        easy:   { pairsCount: 8,  gridClass: 'grid-4', unlocked: true,  colorClass: 'easy-back' },
        medium: { pairsCount: 12, gridClass: 'grid-5', unlocked: false, colorClass: 'medium-back' },
        hard:   { pairsCount: 18, gridClass: 'grid-6', unlocked: false, colorClass: 'hard-back' }
    };

    let currentLevel = 'easy';
    let currentPairs = [];
    let items = [];
    let flippedCards = [];
    let matchedCount = 0;
    let totalPairs = 0;
    let flipCounter = 0;
    let lockBoard = false;
    let timeoutId = null;

    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!soundEnabled) return;
        try {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            switch(type) {
                case 'click':
                    osc.frequency.value = 880;
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'good':
                    osc.frequency.value = 440;
                    osc.start(now);
                    osc.stop(now + 0.15);
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = 523;
                    gain2.gain.setValueAtTime(0.2, now + 0.2);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                    osc2.start(now + 0.2);
                    osc2.stop(now + 0.35);
                    break;
                case 'bad':
                    osc.frequency.value = 220;
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'win':
                    const notes = [523, 659, 784];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.25, now + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.15 + 0.3);
                        o.start(now + i * 0.15);
                        o.stop(now + i * 0.15 + 0.3);
                    });
                    break;
                default: break;
            }
        } catch(e) { console.warn("Audio error", e); }
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildItems() {
        let deck = [];
        currentPairs.forEach((pair, idx) => {
            deck.push({ type: 'mistake', text: pair.mistake, pairId: idx });
            deck.push({ type: 'correction', text: pair.correction, pairId: idx });
        });
        return shuffle(deck);
    }

    function setGridClass() {
        const boardDiv = document.getElementById('gameBoard');
        boardDiv.className = 'game-board';
        boardDiv.classList.add(LEVELS[currentLevel].gridClass);
    }

    function updateLevelButtons() {
        const levelBtns = document.querySelectorAll('.level-btn');
        levelBtns.forEach(btn => {
            const lvl = btn.dataset.level;
            const isUnlocked = LEVELS[lvl].unlocked;
            if (isUnlocked) {
                btn.classList.remove('locked');
                btn.disabled = false;
            } else {
                btn.classList.add('locked');
                btn.disabled = true;
            }
            if (lvl === currentLevel) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function unlockNextLevel() {
        if (currentLevel === 'easy' && !LEVELS.medium.unlocked) {
            LEVELS.medium.unlocked = true;
            document.getElementById('message').innerHTML = '🎉 Aswir ushil yekfa ! Aswir alemmas yeldi 🎉';
            playSound('win');
            updateLevelButtons();
        } else if (currentLevel === 'medium' && !LEVELS.hard.unlocked) {
            LEVELS.hard.unlocked = true;
            document.getElementById('message').innerHTML = '🎉 Aswir alemmas yekfa ! Aswir aweɛran yeldi 🎉';
            playSound('win');
            updateLevelButtons();
        } else if (currentLevel === 'hard' && matchedCount === totalPairs) {
            document.getElementById('message').innerHTML = '🎉 Ayyuz ! Tekfiḍ merra iswiren ! 🎉';
            playSound('win');
        }
    }

    function resetGame() {
        if (timeoutId) clearTimeout(timeoutId);
        const count = LEVELS[currentLevel].pairsCount;
        currentPairs = FULL_PAIRS.slice(0, count);
        totalPairs = currentPairs.length;
        items = buildItems();
        flippedCards = [];
        matchedCount = 0;
        flipCounter = 0;
        document.getElementById('matchedCount').innerText = '0';
        document.getElementById('totalCount').innerText = totalPairs;
        document.getElementById('flipCount').innerText = '0';
        document.getElementById('message').innerText = '🔍 Urar amaynut !';
        lockBoard = false;
        setGridClass();
        renderBoard();
    }

    function setLevel(level) {
        if (!LEVELS[level].unlocked) return;
        currentLevel = level;
        resetGame();
        updateLevelButtons();
    }

    function renderBoard() {
        const boardDiv = document.getElementById('gameBoard');
        const backColorClass = LEVELS[currentLevel].colorClass;
        boardDiv.innerHTML = '';
        items.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = `card ${backColorClass}`;
            card.dataset.index = idx;
            card.dataset.type = item.type;
            card.dataset.text = item.text;
            card.dataset.pairId = item.pairId;
            card.textContent = '🔁';
            card.addEventListener('click', () => flipCard(card));
            boardDiv.appendChild(card);
        });
    }

    function flipCard(card) {
        if (lockBoard) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

        playSound('click');

        const backClass = LEVELS[currentLevel].colorClass;
        card.classList.remove(backClass);
        card.classList.add('flipped');
        card.style.fontSize = '0.7rem';
        
        const typeLabel = card.dataset.type === 'mistake' ? '❌ Tuccḍa' : '✅ Aseɣti';
        card.innerHTML = `<div><span class="badge">${typeLabel}</span><br>${escapeHtml(card.dataset.text)}</div>`;
        flippedCards.push(card);
        flipCounter++;
        document.getElementById('flipCount').innerText = flipCounter;

        if (flippedCards.length === 2) {
            lockBoard = true;
            const cardA = flippedCards[0];
            const cardB = flippedCards[1];
            const pairA = parseInt(cardA.dataset.pairId);
            const pairB = parseInt(cardB.dataset.pairId);
            const typeA = cardA.dataset.type;
            const typeB = cardB.dataset.type;
            const isMatch = (pairA === pairB && typeA !== typeB);

            if (isMatch) {
                document.getElementById('message').innerText = '✔️ Tayuga yelhan !';
                playSound('good');
                if (timeoutId) clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    cardA.classList.add('matched');
                    cardB.classList.add('matched');
                    cardA.classList.remove('flipped');
                    cardB.classList.remove('flipped');
                    matchedCount++;
                    document.getElementById('matchedCount').innerText = matchedCount;
                    flippedCards = [];
                    lockBoard = false;
                    if (matchedCount === totalPairs) {
                        document.getElementById('message').innerHTML = currentLevel === 'hard' ? '🎉 Yekfa uswir ! Ayyuz !' : '🎉 Yekfa uswir ! Aswir nnig-s yeldi !';
                        unlockNextLevel();
                    } else {
                        document.getElementById('message').innerText = '🔍 Kemmel !';
                    }
                    timeoutId = null;
                }, 1800);
            } else {
                document.getElementById('message').innerText = '❌ Tayuga ur nelhi ara';
                playSound('bad');
                if (timeoutId) clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    flippedCards.forEach(c => {
                        c.classList.remove('flipped');
                        c.classList.add(backClass);
                        c.textContent = '🔁';
                        c.style.fontSize = '';
                    });
                    flippedCards = [];
                    lockBoard = false;
                    document.getElementById('message').innerText = '🔁 Zzi snat n tkarḍiwin';  // Correction ici
                    timeoutId = null;
                }, 1200);
            }
        } else {
            document.getElementById('message').innerText = '🔍 Zzi takarḍa tis snat';  // Correction ici
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    const soundToggleBtn = document.getElementById('soundToggleBtn');
    soundToggleBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled && audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    });

    document.getElementById('resetBtn').addEventListener('click', () => resetGame());
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => setLevel(btn.dataset.level));
    });

    LEVELS.easy.unlocked = true;
    LEVELS.medium.unlocked = false;
    LEVELS.hard.unlocked = false;
    currentLevel = 'easy';
    updateLevelButtons();
    resetGame();

    function unlockAudioOnFirstInteraction() {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        document.body.removeEventListener('click', unlockAudioOnFirstInteraction);
    }
    document.body.addEventListener('click', unlockAudioOnFirstInteraction);
</script>
</body>
</html>
